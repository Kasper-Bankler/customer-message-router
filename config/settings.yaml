# Runtime configuration: retrieval and confidence thresholds, model names, latency
# and cost budgets. Every tunable number lives here, never inline in code.

llm:
  # qwen2.5 at 3B, not the 7B PLAN §3 names: this runs on an 8 GB M1 alongside the
  # embedding model and Streamlit, and a 7B model swaps once all three are resident.
  # Swapping it back is a one-line edit here, which is the point of LLMClient.
  model: qwen2.5:3b-instruct
  # Adjudication is a classification, not writing. Nothing here benefits from
  # sampling, and a deterministic router is far easier to evaluate and defend.
  temperature: 0.0
  timeout_seconds: 60
  # One retry, then fail. A model that cannot produce valid JSON twice in a row
  # will not produce it on the third attempt, and the caller fails closed to HUMAN.
  max_validation_retries: 1

intent:
  # Nearest training examples scanned before grouping by intent. 50 is comfortably
  # more than the 5 intents we need, so a candidate is never missed because its
  # examples were crowded out by a denser neighbouring intent.
  knn_neighbours: 50
  # Distinct intents shown to the adjudicator, per PLAN §2. Small enough that the
  # model reliably picks between them rather than pattern-matching a long list.
  candidate_count: 5
  # Applied when the adjudicator overrides the kNN top-1. The two stages
  # disagreeing is weak evidence, so the confidence it produces is discounted.
  agreement_penalty: 0.9

orchestrator:
  # PROVISIONAL. Not tuned — there is no labelled disposition set yet. The Day 5
  # threshold sweep replaces this with an operating point chosen on a
  # precision/recall curve. Until then it is a placeholder, stated as one.
  min_confidence: 0.55
  # Applied when the adjudicator returns "none of these", so no taxonomy row exists
  # to read a risk tier or SLA from. Medium rather than low: an unclassifiable
  # message is not evidence of a harmless one.
  out_of_taxonomy_risk: medium
  out_of_taxonomy_sla_minutes: 120

observability:
  enabled: true
  # One JSONL line per message, appended. Gitignored: traces are runtime artefacts,
  # and even PII-free ones are operational data rather than repository content.
  trace_path: traces/trace.jsonl

rag:
  # The retrieval gate. Thresholds the top-1 article's DENSE COSINE, not the fused
  # RRF score: RRF encodes rank agreement, not relevance, so a document both
  # retrievers rank first scores the maximum even when it is merely the least-bad
  # of thirty. Measured: a perfect match scores 0.0328 and a known-ungrounded query
  # scores 0.0325, which no threshold can separate. See DECISIONS.md.
  #
  # 0.72 chosen on 24 real Banking77 test messages across 12 intents with known FAQ
  # coverage: uncovered intents topped out at 0.7163 and covered ones resumed at
  # 0.7687. PROVISIONAL — n=24 and the distributions overlap below that band. The
  # Day 5 sweep replaces it. Precision-first, per assumption 8.
  retrieval_threshold: 0.72
  # Articles passed to the model as context. Three keeps the prompt short enough
  # that the model cannot quietly answer from a fourth, weakly-related article.
  max_context_articles: 3
  # EU AI Act Article 50: customers must be told they are dealing with an AI.
  # Deliberately contains no phone number — every specific in a reply has to be
  # traceable to a source article, and this line has no source.
  disclosure: "This answer was generated automatically. Ask at any time to be put through to a person."

ingress:
  # Each matched injection pattern contributes this much. One clear hit
  # ("ignore previous instructions") reaches the block threshold on its own,
  # which is the intended behaviour — these phrases have no benign banking use.
  injection_score_per_match: 0.5
  # At or above this, the message is refused and no LLM call is made.
  injection_block_threshold: 0.5
  # langdetect needs some text to work with; below this it guesses from noise.
  # Banking77 messages average ~60 characters, so this only skips the shortest.
  min_chars_for_language_detection: 20

embeddings:
  # Small English bi-encoder. Both the FAQ corpus and Banking77 are English, so a
  # multilingual model would cost size and speed for a capability this prototype
  # never uses — non-English messages are stopped at ingress, not retrieved for.
  model: BAAI/bge-small-en-v1.5
  # bge models are trained asymmetrically: queries carry this instruction, indexed
  # passages carry nothing. Dropping it costs a few points of retrieval quality.
  query_prefix: "Represent this sentence for searching relevant passages: "

coverage:
  # An intent counts as FAQ-covered when its training-example centroid reaches this
  # cosine similarity to at least one article. Not tuned: chosen by ranking all 77
  # intents by best-article similarity and reading down the list until the match
  # stopped being topically correct. That break falls between
  # transfer_not_received_by_recipient (0.774, genuinely answered by doc_028) and
  # exchange_rate (0.767, whose best match only quotes an FX *fee*, never a rate).
  similarity_threshold: 0.77
